# Alembic configuration (plan M9). Run from the repository root:
#
#   alembic -c backend/alembic.ini upgrade head
#   alembic -c backend/alembic.ini downgrade base
#
# There is deliberately NO database URL in this file: it contains a password, so it comes from the
# DATABASE_URL environment variable (see migrations/env.py and SECURITY.md section 1).
# `upgrade head --sql` prints the SQL without connecting and needs no URL.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# Logging for the alembic command line only. The application configures its own, redacted logging.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
