[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travelmate-backend"
version = "0.1.0"
description = "TravelMate AI backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    # The OpenAI SDK, approved by the owner on 2026-10-30. Only app/llm/openai_transport.py may
    # import it (ADR 0001). 3.30.0 was released on 2026-10-14; newer releases were left alone.
    "openai>=3.30,<4",
    # LangGraph, approved by the owner on 2026-10-30 (ADR 0001). Only app/workflow/ may import it.
    # 1.2.14 was released on 2026-10-06; newer releases were left alone.
    "langgraph>=1.2.14,<2",
    # Persistence (plan M9). SQLAlchemy and Alembic are in the approved stack (ADR 0001); the
    # psycopg 3 driver was approved by the owner on 2026-10-30. Only app/persistence/ imports them.
    # Versions chosen were all released at least three weeks before installation.
    "sqlalchemy>=2.1.4,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    # IANA time-zone data for zoneinfo. Windows has none; Linux CI does (PRD NFR-11).
    "tzdata>=2026.5",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=9.0.3,<10",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a PostgreSQL server in TEST_DATABASE_URL; skipped when it is not set",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
